<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IPASGO · Painel Convênios (demo)</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <meta name="description" content="Demo pública e anonimizada — Pref./Câmara × IPASGO por município em Goiás." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="brand-logo" src="assets/logo-ipasgo.svg" width="210" height="56" alt="IPASGO Saúde" />
      <div>
        <p class="eyebrow">Painel de Convênios · demo pública</p>
        <h1>Pref. / Câmara × IPASGO</h1>
      </div>
    </div>
    <div class="top-meta" id="topMeta">Carregando…</div>
  </header>

  <section class="kpis" id="kpis"></section>

  <main class="layout">
    <section class="map-panel">
      <div class="panel-head">
        <h2>% com IPASGO na Câmara</h2>
        <p>Verde = maior cobertura. Clique no município.</p>
      </div>
      <div id="map"></div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="side-panel" id="side">
      <div class="empty-side">Selecione um município no mapa<br/>para ver Pref., Câmara e cobertura.</div>
    </aside>
  </main>

  <footer class="foot">
    <span>Dados agregados e anonimizados · sem identificação de pessoas</span>
    <span id="gerado"></span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="assets/app.js"></script>
</body>
</html>
